<div class="container mt-4">
  <div class="row">

    <div class="col-md-6 offset-md-3">
      <div class="card mb-3">
        <div class="card-header bg-primary text-white">
          <h3>Search Account</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="accountFormGroup" (ngSubmit)="handleSearchAccount()">
            <div class="input-group">
              <span class="input-group-text">Account ID:</span>
              <input type="text" formControlName="accountId" class="form-control" placeholder="e.g. CA1 or CC1">
              <button class="btn btn-info text-white">Search</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-8 offset-md-2" *ngIf="accountDetails">

      <div class="card mb-3 border-primary">
        <div class="card-header bg-light text-primary">
          <strong>Account Information</strong>
        </div>
        <div class="card-body">
          <p><strong>Account ID:</strong> {{accountDetails.accountId}}</p>
          <p><strong>Balance:</strong> <span class="text-success fw-bold">{{accountDetails.balance | number:'1.2-2'}} DH</span></p>
        </div>
      </div>

      <div class="card">
        <div class="card-header bg-secondary text-white">
          <strong>Operations History</strong>
        </div>
        <div class="card-body">
          <table class="table table-striped table-hover">
            <thead>
            <tr>
              <th>ID</th>
              <th>Date</th>
              <th>Type</th>
              <th>Amount</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let op of accountDetails.accountOperationDTOS">
              <td>{{op.id}}</td>
              <td>{{op.operationDate | date:'dd/MM/yyyy HH:mm'}}</td>
              <td>
                  <span class="badge" [ngClass]="op.type === 'DEBIT' ? 'bg-danger' : 'bg-success'">
                    {{op.type}}
                  </span>
              </td>
              <td [ngClass]="op.type === 'DEBIT' ? 'text-danger' : 'text-success'">
                {{op.amount | number:'1.2-2'}} DH
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>
</div>
