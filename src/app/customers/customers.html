<div class="container mt-4">
  <div class="card" *ngIf="customers; else loading">
    <div class="card-header bg-primary text-white">
      <h3>Customers List</h3>
    </div>
    <div class="card-body">

      <form [formGroup]="searchFormGroup" (ngSubmit)="handleSearchCustomers()" class="mb-3">
        <div class="input-group">
          <span class="input-group-text">Keyword:</span>
          <input type="text" formControlName="keyword" class="form-control" placeholder="Search by name...">
          <button class="btn btn-info text-white">
            Search
          </button>
        </div>
      </form>

      <table class="table table-striped table-hover">
        <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Actions</th> </tr>
        </thead>
        <tbody>
        <tr *ngFor="let c of customers">
          <td>{{c.id}}</td>
          <td>{{c.name}}</td>
          <td>{{c.email}}</td>
          <td>
            <button (click)="handleDeleteCustomer(c)" class="btn btn-danger btn-sm">
              Delete
            </button>
          </td>
        </tr>
        </tbody>
      </table>

    </div>
  </div>

  <ng-template #loading>
    <div class="d-flex justify-content-center align-items-center mt-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <span class="ms-2">Loading...</span>
    </div>
  </ng-template>
</div>
