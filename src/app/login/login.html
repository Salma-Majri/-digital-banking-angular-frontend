<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-sm-12">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
          <h2 class="m-0">Se Connecter</h2>
        </div>
        <div class="card-body p-5">
          <div *ngIf="errorMessage" class="alert alert-danger text-center mb-4">
            {{ errorMessage }}
          </div>

          <form [formGroup]="loginFormGroup" (ngSubmit)="handleLogin()">
            <div class="mb-4">
              <label class="form-label fw-semibold">Username :</label>
              <input type="text" formControlName="username" class="form-control form-control-lg rounded-3" placeholder="Entrez votre nom d'utilisateur">
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Mot de passe :</label>
              <input type="password" formControlName="password" class="form-control form-control-lg rounded-3" placeholder="Entrez votre mot de passe">
            </div>
            <button [disabled]="!loginFormGroup.valid" class="btn btn-primary btn-lg w-100 rounded-3" type="submit">
              Connexion
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
